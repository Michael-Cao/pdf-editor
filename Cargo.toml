# File Path: Cargo.toml

[package]
name = "pdf_editor"
version = "0.1.0"
edition = "2021"

[dependencies]
# Desktop Window & Immediate Mode GUI Framework
eframe = "0.31"
egui = "0.31"

# Native OS Asynchronous File Browser Dialog
rfd = "0.14"

# Pure Rust PDF low-level object parsing and manipulation engine
lopdf = { version = "0.34", features = ["nom_parser"] }

# Native Rust PDF parsing & forms library (reused for structural updates)
pdf_oxide = "0.3"
